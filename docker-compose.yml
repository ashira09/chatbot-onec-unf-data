services:
  python:
    build: 
      dockerfile: ./docker/python/Dockerfile
      context: ./
    container_name: python
    volumes:
      - "./src:/app/src"
    depends_on:
    - db
  db:
    image: postgres:15
    container_name: postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chatbot_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: